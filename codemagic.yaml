# Codemagic — Flutter iOS → TestFlight pipeline
# ──────────────────────────────────────────────────────────────────────────────
#
# What this workflow does, end-to-end:
#   1. Pull the Flutter SDK at the pinned version (3.22.0).
#   2. flutter pub get, gen-l10n, build_runner for Isar.
#   3. flutter test.
#   4. cd ios && pod install (Flutter plugins need it before the build).
#   5. flutter build ipa with code-signing handled by the Codemagic CLI
#      using the App Store Connect integration (no hand-written
#      export_options.plist needed).
#   6. Publish the resulting IPA straight to TestFlight, internal beta
#      group "Tester interni".
#
# One-time founder setup before the first run:
#   • In Codemagic UI → Teams → Integrations, add an App Store Connect
#     API key (only takes the issuer ID, key ID, and the .p8 file).
#   • Below in `vars`, replace APP_STORE_APPLE_ID with the real numeric
#     Apple ID you get from App Store Connect → My Apps → Marginalia →
#     App Information → Apple ID.
#   • Generate a distribution certificate + provisioning profile via
#     Codemagic UI → Code signing identities, OR let Codemagic create
#     them on first build by using `ios_signing.auto_provisioning: true`
#     (the simpler path; we use it below).

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # The App Store Connect API key added in Codemagic UI → Teams →
    # Integrations → App Store Connect (integration name "marginalia-asc").
    # `integrations` is a WORKFLOW-level key (sibling of `environment`), NOT
    # nested under environment — Codemagic's validator rejects
    # environment.integrations ("extra fields not permitted") and requires
    # the key at "workflow -> integrations -> app_store_connect". This is what
    # publishing.app_store_connect.auth: integration resolves against.
    integrations:
      app_store_connect: marginalia-asc

    environment:
      # NOTE: intentionally NO declarative `ios_signing:` block here.
      # `environment.ios_signing` only matches provisioning profiles that
      # ALREADY exist in Codemagic — it does not create them — and it is
      # mutually exclusive with the manual `fetch-signing-files` flow below.
      # Having it caused an instant pre-flight failure on the very first
      # build: "No matching profiles found for bundle identifier
      # io.marginalia.app and distribution type app_store". The manual flow in
      # `scripts` (fetch-signing-files --create → keychain add-certificates →
      # xcode-project use-profiles) creates the distribution certificate and
      # the provisioning profile on first run. The App Store Connect API key
      # for those commands comes from `integrations.app_store_connect` above.
      # Pin the Flutter SDK the runner installs. WITHOUT this key the
      # mac_mini_m2 image uses its newest pre-installed Flutter (3.41.7),
      # whose bundled flutter_localizations pins intl 0.20.2 and breaks
      # `flutter pub get` against this repo's `intl: ^0.19.0` constraint
      # (build #2, commit e95a691, failed exactly here at "Set up Flutter").
      # A bare FLUTTER_VERSION var pins NOTHING — only `environment.flutter`
      # is read by Codemagic to select the SDK. 3.22.0 ships Dart 3.4, which
      # satisfies pubspec's `sdk: ">=3.3.0 <4.0.0"`.
      flutter: "3.22.0"
      # The `signing` group holds CERTIFICATE_PRIVATE_KEY — a stable RSA private
      # key (PEM, `-----BEGIN RSA PRIVATE KEY-----`) added as a SECRET in
      # Codemagic UI → App settings → Environment variables (group "signing").
      # `app-store-connect fetch-signing-files --create` needs it to mint AND
      # save the iOS distribution certificate; without it the step dies with
      # "Cannot save Signing Certificates without certificate private key"
      # (build #5, commit 28c636f, failed exactly there — all earlier steps,
      # incl. Initialize keychain, passed). The key is generated ONCE and reused
      # across every build: generating a fresh one per build would create a new
      # distribution certificate each run and hit Apple's cert cap after 2-3.
      groups:
        - signing
      vars:
        BUNDLE_ID: io.marginalia.app
        # The numeric Apple ID (adam ID) of the Marginalia app record in
        # App Store Connect — NOT the developer account ID. Taken from the
        # app URL appstoreconnect.apple.com/apps/6774710376 (set 2026-05-29).
        APP_STORE_APPLE_ID: "6774710376"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Generate iOS native shell
        # The repo deliberately does NOT commit the generated iOS Runner
        # project (Runner.xcodeproj, AppDelegate.swift, Podfile,
        # Assets.xcassets, LaunchScreen.storyboard). They're produced here
        # on the Mac runner, which has the matching Flutter toolchain.
        # `flutter create` is idempotent and NEVER overwrites files that
        # already exist, so the committed ios/Runner/Info.plist is kept.
        script: |
          flutter create --platforms=ios --org io.marginalia .
          # `flutter create` also regenerates the default counter-app
          # test/widget_test.dart (it isn't committed, so it's treated as a
          # missing template file). That boilerplate test imports a `MyApp`
          # widget this project doesn't have, so it fails to COMPILE and takes
          # the whole `flutter test` step down with it — it even crashed the
          # shared Dart compiler and cascaded into the parser test (build #3,
          # commit 2899d3c, died exactly here). Remove it; the real tests live
          # in test/parser/ and pass on their own.
          rm -f test/widget_test.dart
          # `flutter create` derives the bundle id's LAST segment from the build
          # DIRECTORY name, not --org or the pubspec. On Codemagic the repo is
          # cloned to /Users/builder/clone, so the generated id is
          # io.marginalia.CLONE — NOT io.marginalia.marginalia (build #6, commit
          # 665d63f: project.pbxproj read io.marginalia.clone while the App Store
          # profile was for io.marginalia.app, so `xcode-project use-profiles`
          # found no match → archive died "Runner requires a provisioning
          # profile"). The old rewrite only matched io.marginalia.marginalia and
          # was a silent no-op. Normalize WHATEVER that middle segment is to the
          # canonical io.marginalia.app — RunnerTests target first (longer match),
          # then the app target — so it matches the profile + ASC record.
          perl -pi -e 's/io\.marginalia\.[A-Za-z0-9_]+\.RunnerTests/io.marginalia.app.RunnerTests/g' ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = io\.marginalia\.[A-Za-z0-9_]+;/PRODUCT_BUNDLE_IDENTIFIER = io.marginalia.app;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Bundle identifiers in project.pbxproj:"
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj
          # RevenueCat's purchases_flutter (^7.x) needs an iOS 13 minimum, but
          # `flutter create` leaves the Podfile's `platform :ios` line commented
          # out (CocoaPods then defaults to iOS 12.0) and targets iOS 12.0 in the
          # Xcode project — so `pod install` can't resolve purchases_flutter
          # (build #4, commit eb5c198, died here). Raise the floor to 13.0 in
          # both the Podfile and the Runner target.
          perl -pi -e "s/^# platform :ios, .*/platform :ios, '13.0'/" ios/Podfile
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 1[12]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Podfile platform line:"
          grep "platform :ios" ios/Podfile

      - name: Set up Flutter
        script: |
          flutter --version
          flutter pub get

      - name: Generate app icons
        # Builds the full AppIcon set into
        # ios/Runner/Assets.xcassets/AppIcon.appiconset/ from the single
        # 1024x1024 source at assets/icon/app-icon.png. Must run after
        # `flutter create` (asset catalog must exist) and pub get
        # (flutter_launcher_icons must be resolved).
        script: dart run flutter_launcher_icons

      - name: Generate localizations
        script: flutter gen-l10n

      - name: Generate Isar schemas
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        script: flutter test

      - name: Install CocoaPods
        # Flutter plugins (supabase_flutter, file_picker, etc.) ship
        # native code that's linked via CocoaPods. The Podfile is
        # generated by `flutter create --platforms=ios`; this step
        # installs the matching pods for the lockfile.
        script: |
          cd ios && pod install

      - name: Initialize keychain
        # Create the dedicated code-signing keychain BEFORE any certificate
        # is imported into it (canonical Codemagic order).
        script: |
          keychain initialize

      - name: Fetch signing files
        # Creates (on first build) and downloads the iOS distribution
        # certificate + an App Store provisioning profile for io.marginalia.app.
        # `--create` makes whichever resources don't exist yet; the App Store
        # Connect API key is injected from integrations.app_store_connect.
        # `--type IOS_APP_STORE` requests an App Store profile (not dev/ad-hoc).
        # `--certificate-key @env:CERTIFICATE_PRIVATE_KEY` hands the CLI the RSA
        # private key (from the `signing` env group above) that the new
        # distribution certificate is built on — required by `--create`, else
        # "Cannot save Signing Certificates without certificate private key".
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificate to keychain
        # Import the fetched/created signing certificate into the keychain.
        script: |
          keychain add-certificates

      - name: Use fetched profiles
        # Point the Xcode project at the downloaded provisioning profile so
        # build-ipa signs with the matching identity (manual signing).
        script: |
          xcode-project use-profiles

      - name: Build IPA
        # `xcode-project build-ipa` is Codemagic CLI's wrapper around
        # xcodebuild that handles archive + export with sensible
        # defaults. No hand-written export_options.plist required.
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # INTERNAL TestFlight testing only.
        #
        # The `Publishing` step above uploads the IPA to App Store Connect; once
        # Apple finishes processing it, the build is AUTOMATICALLY available to
        # Internal Testers (the App Store Connect users you add under TestFlight
        # → Internal Testing) — no Beta App Review, no Test Information required.
        #
        # We deliberately DROPPED `submit_to_testflight: true` + `beta_groups:
        # [Tester interni]`. Those drive EXTERNAL testing, which needs (a) an
        # external beta group that already exists in App Store Connect and (b)
        # complete Test Information (feedback email + review contact name/phone/
        # email) plus a Beta App Review. Build #8 (commit 7aa181e) uploaded and
        # was processed by Apple just fine, but post-processing then FAILED on
        # exactly those external-only requirements:
        #   "Cannot find Beta group with the name 'Tester interni'"
        #   "Complete test information is required ... for external testing"
        # For a solo internal beta none of that is needed, and leaving it in
        # makes every push report a (misleading) post-processing failure.
        #
        # TO ENABLE EXTERNAL TESTING later: in App Store Connect → TestFlight,
        # create an external group (e.g. "Tester interni") and fill Test Info at
        # appstoreconnect.apple.com/apps/6774710376/testflight/test-info, then
        # re-add:
        #   submit_to_testflight: true
        #   beta_groups:
        #     - Tester interni
