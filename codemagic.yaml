# Codemagic — Flutter iOS → TestFlight pipeline
# ──────────────────────────────────────────────────────────────────────────────
#
# What this workflow does, end-to-end:
#   1. Pull the Flutter SDK at the pinned version (3.22.0).
#   2. flutter pub get, gen-l10n, build_runner for Isar.
#   3. flutter test.
#   4. cd ios && pod install (Flutter plugins need it before the build).
#   5. flutter build ipa with code-signing handled by the Codemagic CLI
#      using the App Store Connect integration (no hand-written
#      export_options.plist needed).
#   6. Publish the resulting IPA straight to TestFlight, internal beta
#      group "Tester interni".
#
# One-time founder setup before the first run:
#   • In Codemagic UI → Teams → Integrations, add an App Store Connect
#     API key (only takes the issuer ID, key ID, and the .p8 file).
#   • Below in `vars`, replace APP_STORE_APPLE_ID with the real numeric
#     Apple ID you get from App Store Connect → My Apps → Marginalia →
#     App Information → Apple ID.
#   • Generate a distribution certificate + provisioning profile via
#     Codemagic UI → Code signing identities, OR let Codemagic create
#     them on first build by using `ios_signing.auto_provisioning: true`
#     (the simpler path; we use it below).

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # The App Store Connect API key added in Codemagic UI → Teams →
    # Integrations → App Store Connect (integration name "marginalia-asc").
    # `integrations` is a WORKFLOW-level key (sibling of `environment`), NOT
    # nested under environment — Codemagic's validator rejects
    # environment.integrations ("extra fields not permitted") and requires
    # the key at "workflow -> integrations -> app_store_connect". This is what
    # publishing.app_store_connect.auth: integration resolves against.
    integrations:
      app_store_connect: marginalia-asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.marginalia.app
      vars:
        FLUTTER_VERSION: "3.22.0"
        BUNDLE_ID: io.marginalia.app
        # The numeric Apple ID (adam ID) of the Marginalia app record in
        # App Store Connect — NOT the developer account ID. Taken from the
        # app URL appstoreconnect.apple.com/apps/6774710376 (set 2026-05-29).
        APP_STORE_APPLE_ID: "6774710376"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Generate iOS native shell
        # The repo deliberately does NOT commit the generated iOS Runner
        # project (Runner.xcodeproj, AppDelegate.swift, Podfile,
        # Assets.xcassets, LaunchScreen.storyboard). They're produced here
        # on the Mac runner, which has the matching Flutter toolchain.
        # `flutter create` is idempotent and NEVER overwrites files that
        # already exist, so the committed ios/Runner/Info.plist is kept.
        script: |
          flutter create --platforms=ios --org io.marginalia .
          # --org io.marginalia makes the bundle id io.marginalia.marginalia;
          # rewrite it to the canonical io.marginalia.app that the signing
          # config above and the App Store Connect record both expect.
          perl -pi -e 's/io\.marginalia\.marginalia/io.marginalia.app/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Bundle identifiers in project.pbxproj:"
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj

      - name: Set up Flutter
        script: |
          flutter --version
          flutter pub get

      - name: Generate app icons
        # Builds the full AppIcon set into
        # ios/Runner/Assets.xcassets/AppIcon.appiconset/ from the single
        # 1024x1024 source at assets/icon/app-icon.png. Must run after
        # `flutter create` (asset catalog must exist) and pub get
        # (flutter_launcher_icons must be resolved).
        script: dart run flutter_launcher_icons

      - name: Generate localizations
        script: flutter gen-l10n

      - name: Generate Isar schemas
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        script: flutter test

      - name: Install CocoaPods
        # Flutter plugins (supabase_flutter, file_picker, etc.) ship
        # native code that's linked via CocoaPods. The Podfile is
        # generated by `flutter create --platforms=ios`; this step
        # installs the matching pods for the lockfile.
        script: |
          cd ios && pod install

      - name: Fetch signing files
        # Pulls the distribution certificate + provisioning profile
        # from Codemagic's managed signing storage. The `--type
        # IOS_APP_STORE` flag matches the distribution_type above.
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Use fetched profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        # `xcode-project build-ipa` is Codemagic CLI's wrapper around
        # xcodebuild that handles archive + export with sensible
        # defaults. No hand-written export_options.plist required.
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Tester interni
