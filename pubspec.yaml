name: marginalia
description: Riscopri i tuoi highlight Kindle attraverso widget intelligenti e cerchie di lettura.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Backend
  supabase_flutter: ^2.5.0

  # WebView (Amazon sync)
  webview_flutter: ^4.8.0

  # Navigation
  go_router: ^13.2.4

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Typography
  google_fonts: ^6.2.1

  # File / condivisione
  file_picker: ^8.1.2

  # Kobo import — reads the user's KoboReader.sqlite (Bookmark + content tables)
  # to import highlights. sqlite3_flutter_libs bundles the native sqlite3 for iOS.
  sqlite3: ^2.0.0
  sqlite3_flutter_libs: ^0.5.0
  share_plus: ^10.0.1

  # Widget iOS / home screen
  home_widget: ^0.7.0
  http: ^1.2.1

  # Payments / subscriptions
  # TEMPORARILY DISABLED — 2026-05-29. purchases_flutter ^7.x bundles an old
  # PurchasesHybridCommon pod whose Swift fails to compile on the Codemagic
  # runner's Xcode 26.4 ('SubscriptionPeriod' is ambiguous), breaking Build IPA.
  # The RevenueCat key was only ever the placeholder, so nothing functional is
  # lost. Re-enable when wiring a real paywall (see the restore notes in
  # lib/core/services/subscription_service_native.dart).
  # purchases_flutter: ^7.0.0

  # Localizzazione
  flutter_localizations:
    sdk: flutter

  # URL launching (privacy policy, external links)
  url_launcher: ^6.3.0

  # Calendar — today's events feed the "frase scelta per te" context.
  # EventKit needs no entitlement, only the Info.plist usage strings.
  device_calendar: ^4.3.3

  # HealthKit — steps + menstrual-cycle phase feed the daily phrase.
  # Needs the HealthKit entitlement + App ID capability + Info.plist strings.
  # 11.x adds HealthDataType.MENSTRUATION_FLOW while keeping the Health()
  # singleton + getTotalStepsInInterval (12.x removes the singleton). Pinned
  # <12 deliberately so the steps API used below keeps compiling.
  health: ">=11.1.1 <12.0.0"

  # Utility
  intl: ^0.19.0
  crypto: ^3.0.3
  collection: ^1.18.0
  equatable: ^2.0.5

  # CupertinoIcons font — required so the SF-Symbol-style icons in the
  # bottom nav (CupertinoIcons.house, .book, .person_2, .paperplane,
  # .person_crop_circle) actually render. Without this package the
  # glyphs fall back to empty .notdef boxes.
  cupertino_icons: ^1.0.8

  # Phosphor Icons — provides the thick-stroke rounded-corner outline
  # style the user requested as a brand for the navbar and post toolbar
  # (matches the visual reference: house, paper-plane-tilt, magnifying
  # glass, etc.). Tree-shaken at build time so only used glyphs ship.
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  # Generates AppIcon set (iOS) + Android launcher icons from a single
  # source PNG. Run once after providing assets/icon/app-icon.png:
  #   dart run flutter_launcher_icons
  # Config lives in `flutter_launcher_icons.yaml` at the repo root.
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/demo/My Clippings.txt
    - docs/privacy/index.html
    - docs/privacy/it/index.html
