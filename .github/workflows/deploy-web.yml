# Static site → GitHub Pages
# ──────────────────────────────────────────────────────────────────────────────
# This used to build and deploy the FULL Flutter web app. That build was old,
# crashed on open ("ProviderContainer was already disposed") and users landed
# on it from the password-reset email. Killed on founder request (2026-06-11):
# Pages now serves the static docs/ folder only —
#   index.html            tiny branded landing
#   app.html              password-reset / email-confirm page (supabase-js);
#                         SAME URL the reset emails already point to, so no
#                         dashboard change is needed for old emails to work
#   privacy/ terms/       legal pages (IT + EN)
# The founder console is NOT here any more. GitHub Pages serves docs/, and this
# repo is public, so a folder named after the console's secret path published
# that path to anyone who opened the repository — and Pages served a second
# copy of the page besides the real one on get-scripta.app. It now lives in
# admin-console/ and is assembled onto its (rotated, gitignored) path by
# deploy_site.ps1, which publishes to Cloudflare Pages.
#
# Deploys from the ACTIVE branch (feat/profile-ui-privacy) on site changes —
# master is stale and pushing it would also trigger an iOS build of old code.
name: Deploy static site → GitHub Pages

# Automatic deploys are OFF (founder request: "togli le vecchie versioni da
# GitHub"). get-scripta.app is served by Cloudflare Pages via deploy_site.ps1,
# and Pages was publishing a second, competing copy of the same docs/ folder.
#
# Held back until 2026-08-26 for one reason: password-reset emails carried
# `redirect_to` at the old github.io address, so switching Pages off would have
# broken recovery for anyone holding a link. Supabase's Site URL now points at
# https://get-scripta.app/app (verified by sending a real reset and reading the
# delivered mail), the app no longer hardcodes the old address, and reset links
# expire after an hour — so nothing depends on Pages any more.
#
# Kept runnable by hand rather than deleted: if Cloudflare ever fails, this is
# a working fallback that is one click away.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # actions/deploy-pages@v4 fetches its tarball from codeload.github.com,
      # which occasionally returns 404 for a few seconds and breaks the
      # whole deploy. Wandalen/wretry re-attempts on transient failures.
      - name: Deploy to GitHub Pages (with retry)
        id: deployment
        uses: Wandalen/wretry.action@v3
        with:
          action: actions/deploy-pages@v4
          attempt_limit: 3
          attempt_delay: 10000
