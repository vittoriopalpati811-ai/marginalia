# iOS → TestFlight on GitHub Actions (FREE macOS runners — public repo)
# ──────────────────────────────────────────────────────────────────────────────
# This is a 1:1 port of codemagic.yaml so the OUTPUT is identical: same Flutter
# 3.22.0, same widget + Apple-Watch target injection, same App Store Connect
# signing (we install Codemagic's OWN open-source CLI — `codemagic-cli-tools` —
# and call the exact same `app-store-connect` / `keychain` / `xcode-project`
# commands), same CFBundleVersion=timestamp, same internal-TestFlight upload.
#
# Why this exists: Codemagic free tier is 500 build-min/month and gets exhausted.
# This repo is PUBLIC, so GitHub's macOS runners are free with no monthly cap.
# codemagic.yaml is kept as-is — both paths build the same thing.
#
# ┌─ ONE-TIME founder setup: add these 4 repository secrets ────────────────────┐
# │  GitHub → repo → Settings → Secrets and variables → Actions → New secret    │
# │                                                                             │
# │  1. APP_STORE_CONNECT_KEY_IDENTIFIER  — the App Store Connect API Key ID    │
# │  2. APP_STORE_CONNECT_ISSUER_ID       — the Issuer ID (same key page)       │
# │  3. APP_STORE_CONNECT_PRIVATE_KEY     — the WHOLE contents of the .p8 file   │
# │       (App Store Connect → Users and Access → Integrations → App Store      │
# │        Connect API → generate a key with App Manager/Admin access, download │
# │        the AuthKey_XXXX.p8 ONCE, paste its full text incl. BEGIN/END lines) │
# │  4. CERTIFICATE_PRIVATE_KEY           — an RSA private key for the iOS dist  │
# │       certificate. Generate once on any machine:                            │
# │           openssl genrsa 2048                                               │
# │       and paste the full PEM (-----BEGIN RSA PRIVATE KEY----- … END).       │
# │       (Same key reused every build so Apple's cert cap isn't hit. If        │
# │        `--create` later says the cert cap is full, revoke an old            │
# │        distribution cert in the Apple Developer portal and re-run.)         │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# The same App Store Connect API key you already use in Codemagic works here —
# if you saved its .p8 you can reuse it; otherwise just generate a new one
# (free, takes a minute). Nothing else is needed; certs/profiles are created
# automatically on the first green run, exactly like Codemagic.

name: iOS → TestFlight

on:
  push:
    branches:
      - feat/profile-ui-privacy
      - main
      - master
  workflow_dispatch: {}   # manual "Run workflow" button (pick any branch)

# Don't pile up overlapping iOS builds on rapid pushes — keep only the latest.
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this build only READS the repo and uploads to TestFlight /
# artifacts (via the App Store Connect API key + the Actions runtime token) —
# it never pushes back to the repo. Scope the GITHUB_TOKEN to read-only so a
# compromised step or transitive build dependency can't tamper with the repo
# or releases. (Public repo carries high-value signing secrets, so this matters.)
permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: io.marginalia.app
      # Numeric Apple ID (adam id) of the Marginalia app record in App Store
      # Connect (appstoreconnect.apple.com/apps/6774710376).
      APP_STORE_APPLE_ID: "6774710376"
      # The Codemagic CLI auto-reads these three for App Store Connect auth
      # (same values Codemagic's integration injects). From repo secrets.
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      # RSA key the new distribution certificate is built on (reused every run).
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable
          cache: true

      - name: Install Codemagic CLI tools
        # Provides the SAME `app-store-connect`, `keychain`, `xcode-project`
        # commands Codemagic runs internally — this is what guarantees the
        # signing + upload behave identically. Installed into an isolated venv:
        # the runner's Homebrew Python is PEP-668 "externally managed", so a bare
        # `pip3 install` is refused with "externally-managed-environment". The
        # venv's bin is prepended to PATH so every later step sees the commands.
        run: |
          python3 -m venv "$HOME/cmcli"
          "$HOME/cmcli/bin/pip" install --upgrade pip wheel
          "$HOME/cmcli/bin/pip" install codemagic-cli-tools
          echo "$HOME/cmcli/bin" >> "$GITHUB_PATH"
          "$HOME/cmcli/bin/app-store-connect" --version

      - name: Verify & validate signing secrets
        # Apple returned 401 even though the secrets are present, so validate the
        # FORMAT of each (a wrong/mismatched value is the usual cause). Emits a
        # specific ::error:: per malformed field. Never prints the values — only
        # lengths and pattern pass/fail (and GitHub masks the values anyway).
        run: |
          ok=1
          KID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          ISS="$APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KID" ] || { echo "::error::APP_STORE_CONNECT_KEY_IDENTIFIER empty"; ok=0; }
          [ -n "$ISS" ] || { echo "::error::APP_STORE_CONNECT_ISSUER_ID empty"; ok=0; }
          [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ] || { echo "::error::APP_STORE_CONNECT_PRIVATE_KEY empty"; ok=0; }
          [ -n "$CERTIFICATE_PRIVATE_KEY" ] || { echo "::error::CERTIFICATE_PRIVATE_KEY empty"; ok=0; }
          echo "lengths -> KeyID:${#KID}  IssuerID:${#ISS}  p8:${#APP_STORE_CONNECT_PRIVATE_KEY}  cert:${#CERTIFICATE_PRIVATE_KEY}"
          if printf '%s' "$KID" | grep -Eq '^[A-Za-z0-9]{10}$'; then echo "Key ID format OK"; else echo "::error title=Key ID malformed::APP_STORE_CONNECT_KEY_IDENTIFIER must be EXACTLY 10 letters/digits, no spaces/label/newline. Current length=${#KID}"; ok=0; fi
          if printf '%s' "$ISS" | grep -Eiq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo "Issuer ID format OK"; else echo "::error title=Issuer ID malformed::APP_STORE_CONNECT_ISSUER_ID must be a UUID like 69a6de70-xxxx-xxxx-xxxx-xxxxxxxxxxxx. Current length=${#ISS}"; ok=0; fi
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | openssl pkey -noout 2>/dev/null; then echo ".p8 parses OK"; else echo "::error title=.p8 unparseable::APP_STORE_CONNECT_PRIVATE_KEY is not a valid private key. Re-copy the ENTIRE AuthKey_XXXX.p8 incl. the BEGIN/END lines."; ok=0; fi
          if printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl pkey -noout 2>/dev/null; then echo "cert key parses OK"; else echo "::error title=cert key unparseable::CERTIFICATE_PRIVATE_KEY is not a valid private key."; ok=0; fi
          # The App Store Connect .p8 is an EC (P-256) key; CERTIFICATE_PRIVATE_KEY
          # is RSA. If they were pasted into each other's box, both parse but the
          # JWT auth 401s. Detect the swap precisely.
          ASC_TXT=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | openssl pkey -noout -text 2>/dev/null)
          CERT_TXT=$(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | openssl pkey -noout -text 2>/dev/null)
          if echo "$ASC_TXT" | grep -qiE 'prime256v1|id-ecpublickey|nist curve|ec private'; then ASC_KIND=EC; elif echo "$ASC_TXT" | grep -qiE 'modulus|publicexponent|rsa'; then ASC_KIND=RSA; else ASC_KIND=unknown; fi
          if echo "$CERT_TXT" | grep -qiE 'prime256v1|id-ecpublickey|nist curve|ec private'; then CERT_KIND=EC; elif echo "$CERT_TXT" | grep -qiE 'modulus|publicexponent|rsa'; then CERT_KIND=RSA; else CERT_KIND=unknown; fi
          echo "key kinds -> ASC .p8: $ASC_KIND (expected EC)   CERT: $CERT_KIND (expected RSA)"
          [ "$ASC_KIND" = "RSA" ] && { echo "::error title=.p8 box holds the RSA key::APP_STORE_CONNECT_PRIVATE_KEY contains an RSA key, but the App Store Connect .p8 is EC. You SWAPPED the two: put the AuthKey_XXXX.p8 in APP_STORE_CONNECT_PRIVATE_KEY and the RSA key in CERTIFICATE_PRIVATE_KEY."; ok=0; }
          [ "$CERT_KIND" = "EC" ] && { echo "::error title=cert box holds the .p8::CERTIFICATE_PRIVATE_KEY contains an EC key (that is the App Store Connect .p8). Swap the two secrets."; ok=0; }
          [ "$ok" = 1 ] || { echo "Fix the flagged secret(s) and re-run."; exit 1; }
          echo "Secrets present, well-formed, correct TYPES (ASC=EC, cert=RSA). If it still 401s, the Key ID / Issuer ID don't match the .p8 key."

      - name: Diag probe — fetch app signing profile (surfaces the real error fast)
        # TEMPORARY diagnostic: runs the app fetch-signing-files BEFORE the long
        # build so the real App Store Connect error appears in ~3 min instead of
        # ~15, and emits it via ::error:: (readable through the public check-runs
        # annotations API). Removed once signing is green.
        run: |
          keychain initialize || true
          set +e
          OUT=$(app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create 2>&1)
          rc=$?
          printf '%s\n' "$OUT" | tail -n 50
          if [ "$rc" -ne 0 ]; then
            MSG=$(printf '%s' "$OUT" | tr '\n\r\t' '   ' | tail -c 1600)
            echo "::error title=fetch-signing-files error::$MSG"
            exit 1
          fi
          echo "Probe OK — app signing profile fetched."

      - name: Generate iOS native shell
        run: |
          flutter create --platforms=ios --org io.marginalia .
          rm -f test/widget_test.dart
          # Normalize whatever middle segment flutter create derived (from the
          # build dir name) to the canonical io.marginalia.app — RunnerTests
          # first (longer match), then the app target.
          perl -pi -e 's/io\.marginalia\.[A-Za-z0-9_]+\.RunnerTests/io.marginalia.app.RunnerTests/g' ios/Runner.xcodeproj/project.pbxproj
          perl -pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = io\.marginalia\.[A-Za-z0-9_]+;/PRODUCT_BUNDLE_IDENTIFIER = io.marginalia.app;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Bundle identifiers in project.pbxproj:"
          grep PRODUCT_BUNDLE_IDENTIFIER ios/Runner.xcodeproj/project.pbxproj
          # purchases_flutter needs iOS 13 min; raise the Podfile + project floor.
          perl -pi -e "s/^# platform :ios, .*/platform :ios, '13.0'/" ios/Podfile
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 1[12]\.0;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          echo "Podfile platform line:"
          grep "platform :ios" ios/Podfile
          # Wire the committed push entitlements into the app target only.
          perl -pi -e 's{PRODUCT_BUNDLE_IDENTIFIER = io\.marginalia\.app;}{PRODUCT_BUNDLE_IDENTIFIER = io.marginalia.app;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;}g' ios/Runner.xcodeproj/project.pbxproj
          echo "Entitlements wiring count:"
          grep -c CODE_SIGN_ENTITLEMENTS ios/Runner.xcodeproj/project.pbxproj || echo "  (none)"
          # Rebrand: force the home-screen app name to "Scripta". flutter create
          # derives CFBundleDisplayName from the package name; set it explicitly
          # so it is guaranteed regardless of derivation.
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Scripta" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Scripta" ios/Runner/Info.plist
          # CFBundleName too: Notification Center / Settings fall back to it,
          # and the committed plist used to carry "marginalia" — set BOTH so
          # every system surface says "Scripta".
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Scripta" ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string Scripta" ios/Runner/Info.plist
          echo "Home-screen name -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/Runner/Info.plist) / $(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' ios/Runner/Info.plist)"
          # Camera + photo-library usage strings (image_picker, for snapping or
          # picking a custom book cover). Without these iOS hard-crashes the
          # first time the camera/photo library is opened.
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Take a photo to use as a custom book cover." ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Take a photo to use as a custom book cover.'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Choose a photo to use as a custom book cover." ios/Runner/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choose a photo to use as a custom book cover.'" ios/Runner/Info.plist

      - name: Inject widget + watch extension targets
        run: |
          gem install xcodeproj --no-document 2>/dev/null || sudo gem install xcodeproj --no-document 2>/dev/null || true
          ruby ios/scripts/add_widgets_extension.rb
          echo "Widget extension references:"
          # FATAL when absent: an IPA without the widget extension ships fine
          # but every widget on users' home screens freezes forever ("non si
          # aggiornano né automaticamente né manualmente"). Fail loudly instead.
          grep -c "MarginaliaWidgetsExtension" ios/Runner.xcodeproj/project.pbxproj || { echo "::error title=Widget injection failed::MarginaliaWidgetsExtension not referenced in project.pbxproj after add_widgets_extension.rb"; exit 1; }
          ruby ios/scripts/add_watch_targets.rb
          echo "Watch target references:"
          grep -c "MarginaliaWatch" ios/Runner.xcodeproj/project.pbxproj || echo "  (watch NOT found — injection failed!)"

      - name: Set up Flutter deps
        run: |
          flutter --version
          flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Isar schemas
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Validate widget extension compiles (simulator, no signing)
        continue-on-error: true
        run: |
          set +e
          ruby -e "require 'xcodeproj'; puts 'Targets: ' + Xcodeproj::Project.open('ios/Runner.xcodeproj').targets.map(&:name).join(', ')"
          echo "Building Runner (incl. embedded widget) for simulator, no codesign…"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 60
          echo "xcodebuild exit: ${PIPESTATUS[0]}"
          if ls -d ~/Library/Developer/Xcode/DerivedData/*/Build/Products/*-iphonesimulator/Runner.app/PlugIns/*.appex >/dev/null 2>&1; then
            echo "### WIDGET COMPILE PASS: .appex embedded in Runner.app ###"
          else
            echo "### WIDGET COMPILE: .appex not found — inspect the tail above ###"
          fi
          exit 0

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch signing files (app + widget + watch app + watch widget)
        # Pass auth explicitly (issuer/key/private-key) instead of relying on the
        # CLI's env-var auto-read, so it can't silently fail to pick up the key.
        run: |
          AUTH="--issuer-id $APP_STORE_CONNECT_ISSUER_ID --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY"
          for BID in \
            "$BUNDLE_ID" \
            "io.marginalia.app.MarginaliaWidgets" \
            "io.marginalia.app.watchkitapp" \
            "io.marginalia.app.watchkitapp.MarginaliaWatchWidgets"; do
            echo "──── fetch-signing-files: $BID ────"
            app-store-connect fetch-signing-files "$BID" \
              $AUTH \
              --type IOS_APP_STORE \
              --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
              --create
          done

      - name: Add certificate to keychain
        run: keychain add-certificates

      - name: Use fetched profiles
        run: xcode-project use-profiles

      - name: Set iOS build number (unix timestamp, race-proof)
        run: |
          NOW=$(date +%s)
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" 2>/dev/null || true)
          case "$LATEST" in
            ''|*[!0-9]*) NEXT="$NOW" ;;
            *) if [ "$LATEST" -ge "$NOW" ]; then NEXT=$((LATEST + 1)); else NEXT="$NOW"; fi ;;
          esac
          echo "Latest ASC build number: '${LATEST:-none}', now=$NOW -> CFBundleVersion $NEXT"
          perl -pi -e "s/^FLUTTER_BUILD_NUMBER=.*/FLUTTER_BUILD_NUMBER=$NEXT/" ios/Flutter/Generated.xcconfig
          grep FLUTTER_BUILD ios/Flutter/Generated.xcconfig
          BUILD_NAME=$(grep '^FLUTTER_BUILD_NAME=' ios/Flutter/Generated.xcconfig | cut -d= -f2)
          BUILD_NAME=${BUILD_NAME:-1.0.0}
          perl -pi -e "s/__BUILD_NUMBER__/$NEXT/g; s/__BUILD_NAME__/$BUILD_NAME/g" ios/MarginaliaWidgets/Info.plist
          echo "Widget extension version → $BUILD_NAME ($NEXT)"
          for plist in ios/MarginaliaWatch/Info.plist ios/MarginaliaWatchWidgets/Info.plist; do
            perl -pi -e "s/__BUILD_NUMBER__/$NEXT/g; s/__BUILD_NAME__/$BUILD_NAME/g" "$plist"
          done
          echo "Watch versions set to $BUILD_NAME ($NEXT)"

      - name: Inject Sentry DSN (optional, from repo secret)
        # When the SENTRY_DSN repo secret is set, append it as a Dart define to
        # Generated.xcconfig so the IPA enables Sentry crash reporting. The DSN
        # therefore lives ONLY in GitHub secrets, never in the repo. No-op (and
        # Sentry stays disabled) when the secret is absent — so this never breaks
        # a build. Runs after "Set iOS build number" (Generated.xcconfig exists).
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "No SENTRY_DSN secret — Sentry stays disabled (no-op)."
            exit 0
          fi
          # Strip ALL whitespace from the secret FIRST. A stray trailing newline
          # in the pasted secret otherwise ends up inside the compiler's
          # -DSENTRY_DSN=… flag and makes the Xcode "Run Script" (flutter
          # assemble) throw "Unhandled exception" — exactly what broke the first
          # 1.0.33 build once the secret was added.
          CLEAN=$(printf '%s' "$SENTRY_DSN" | tr -d '[:space:]')
          # Defensive: only inject a well-formed DSN so a bad value can NEVER
          # break the build — Sentry just stays off instead.
          case "$CLEAN" in
            https://*@*sentry.io/*) : ;;
            *) echo "SENTRY_DSN not a well-formed DSN — skipping (Sentry off, build stays green)."; exit 0 ;;
          esac
          DEF=$(printf 'SENTRY_DSN=%s' "$CLEAN" | base64 | tr -d '\n')
          XC=ios/Flutter/Generated.xcconfig
          EXISTING=$(grep '^DART_DEFINES=' "$XC" 2>/dev/null | head -1 | cut -d= -f2-)
          if [ -n "$EXISTING" ]; then NEW="$EXISTING,$DEF"; else NEW="$DEF"; fi
          grep -v '^DART_DEFINES=' "$XC" > "$XC.tmp" 2>/dev/null || true
          echo "DART_DEFINES=$NEW" >> "$XC.tmp"
          mv "$XC.tmp" "$XC"
          echo "Sentry DSN injected into DART_DEFINES (whitespace-stripped, validated)."

      - name: Build IPA
        run: |
          set +e
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --config Release 2>&1 | tee /tmp/buildipa.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "=== Build IPA failed (rc=$rc) — extracting real error ==="
            ERR=$(grep -hE "error:|fatal error|The following build commands failed|Command .* failed|Undefined symbol|No profiles|provisioning profile|requires a provisioning|code ?sign|ITMS|Error \(Xcode\)" /tmp/buildipa.log /tmp/xcodebuild_logs/*.log 2>/dev/null | grep -viE "0 errors|errors generated\." | tail -n 30)
            echo "----- extracted -----"
            echo "$ERR"
            echo "---------------------"
            MSG=$(printf '%s' "$ERR" | tr '\n\r\t' '   ' | tail -c 1700)
            echo "::error title=Build IPA error::${MSG:-see logs (no pattern matched)}"
            exit "$rc"
          fi

      - name: Verify widget extension is inside the IPA
        # Hard guarantee BEFORE upload: the .appex must be embedded in the app
        # bundle, otherwise home-screen widgets show frozen/placeholder content
        # on every device. Cheap (unzip -l) and catches any silent regression
        # in target injection or the embed phase.
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Inspecting $IPA"
          if unzip -l "$IPA" | grep -q "PlugIns/MarginaliaWidgetsExtension.appex/"; then
            echo "Widget extension .appex present in the IPA ✔"
          else
            unzip -l "$IPA" | grep -i -E "appex|PlugIns" || true
            echo "::error title=Widget missing from IPA::MarginaliaWidgetsExtension.appex is NOT embedded — widgets would never update. Refusing to publish."
            exit 1
          fi

      - name: Publish to TestFlight (internal)
        # Uploads the IPA to App Store Connect; once Apple finishes processing,
        # the build is automatically available to Internal Testers — no Beta
        # App Review, mirroring codemagic.yaml's internal-only publishing.
        run: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --max-build-processing-wait 0

      - name: Upload artifacts (IPA + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/ios/ipa/*.ipa
            /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore
