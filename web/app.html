<!DOCTYPE html>
<html>
<head>
  <base href="/marginalia/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Marginalia — riscopri i tuoi highlight Kindle">
  <!-- iOS Safari full-screen PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marginalia">
  <!-- black-translucent: status bar overlaps the app; Flutter handles safe-area insets -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F9F8F5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <title>Marginalia</title>
  <style>
    /*
     * iOS Safari: 100vh = full screen height INCLUDING the address bar, causing
     * content to be clipped. -webkit-fill-available is the correct fix for Safari.
     * We apply it to <html> and then let <body> inherit with height: 100%.
     */
    html {
      height: -webkit-fill-available;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #F9F8F5;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
