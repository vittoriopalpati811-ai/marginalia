<!DOCTYPE html>
<html>
<head>
  <base href="/marginalia/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="Marginalia — riscopri i tuoi highlight Kindle">
  <!-- iOS Safari full-screen PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marginalia">
  <!-- black-translucent: status bar overlaps the app; Flutter handles safe-area insets -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#F9F8F5">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">
  <title>Marginalia</title>
  <style>
    html { height: -webkit-fill-available; }
    body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #F9F8F5;
      font-family: -apple-system, sans-serif;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #F9F8F5;
      gap: 16px;
      transition: opacity 0.3s;
    }
    #loading-m {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #4A7A35, #2F5220);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; color: #F1EEE7;
      font-family: Georgia, serif;
      box-shadow: 0 4px 20px rgba(74,122,53,0.3);
    }
    #loading-text {
      font-size: 13px; color: #9E9689; letter-spacing: 0.2px;
    }
    #loading-error {
      display: none;
      text-align: center; padding: 0 32px;
      font-size: 14px; color: #6B6560; line-height: 1.6;
    }
    #loading-error a {
      color: #4A7A35; font-weight: 600; text-decoration: none;
      display: inline-block; margin-top: 12px;
      border: 1px solid #4A7A35; border-radius: 10px;
      padding: 10px 20px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-m">M</div>
    <div id="loading-text">Loading Marginalia…</div>
    <div id="loading-error">
      <p style="font-size:13px; color:#A8A29C; margin-bottom:12px">
        Taking longer than usual…
      </p>
      <a href="javascript:window.location.reload(true)"
         style="border:1px solid #4A7A35; border-radius:10px; padding:10px 24px;
                color:#4A7A35; font-weight:600; font-size:14px; text-decoration:none;">
        Reload
      </a>
    </div>
  </div>

  <script>
    // Clear stale service worker caches — old cached files can break the app
    // on Safari when the build changes. Unregister and let Flutter re-register.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      });
    }

    // Hide loading overlay once Flutter signals it's ready
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 300); }
    });

    // Show retry button after 30s (generous for slow mobile connections)
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el) return; // already gone — Flutter loaded fine
      document.getElementById('loading-text').textContent = 'Still loading…';
      document.getElementById('loading-error').style.display = 'block';
    }, 30000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
