# Generates the iOS AppIcon set and Android launcher icon from a single
# 1024×1024 PNG source. Run once after providing the source:
#
#   dart run flutter_launcher_icons
#
# The source PNG should be:
#   • Exactly 1024×1024 pixels
#   • No alpha / transparency (Apple rejects transparent App Store icons)
#   • No rounded corners — iOS applies its own mask
#   • Saved at assets/icon/app-icon.png
#
# Output:
#   • iOS: ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
#         (all sizes from 20pt @1x up to 1024×1024 marketing icon)
#
# The package overwrites the AppIcon set on every run, so re-running is
# safe and idempotent.
#
# Android is disabled: the CI build runs `flutter create --platforms=ios`
# only, so there is no android/ project for this package to write into.
# Re-enable (android: "launcher_icon") if/when we ship Android.

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon/app-icon.png"
  remove_alpha_ios: true
