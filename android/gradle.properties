org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 7.4.2 ships an older bundled aapt2 that cannot read android-35/android.jar
# ("RES_TABLE_TYPE_TYPE entry offsets overlap"), which broke the RELEASE resource
# link (debug uses a different path). Point AGP at build-tools 35's aapt2, which
# parses the API-35 platform correctly. Forward slashes are valid on Windows here.
android.aapt2FromMavenOverride=C:/Users/User/Android/Sdk/build-tools/35.0.0/aapt2.exe
