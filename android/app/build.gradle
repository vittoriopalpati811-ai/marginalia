plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "io.marginalia.marginalia"
    // Several plugins (sqlite3_flutter_libs, etc.) require API 35. Pin compileSdk
    // to 35 AND use build-tools 35 so the release-only aapt2 resource-linking
    // step can read android-35/android.jar — build-tools 34's aapt2 cannot, which
    // failed the release build at :sqlite3_flutter_libs:verifyReleaseResources
    // (debug builds skip that step, which is why `flutter run` never hit it).
    compileSdk = 35
    buildToolsVersion = "35.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Matches the iOS bundle id (io.marginalia.app) so a future Firebase /
        // FCM / Play Console setup is consistent across both platforms.
        applicationId = "io.marginalia.app"
        // health (Health Connect) requires a minSdk of 26; the other native
        // plugins (Isar, sqlite3, webview, device_calendar) are all <= 26.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
